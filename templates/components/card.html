{% if gradient %}
<div class='rounded-xl bg-gradient-to-br from-indigo-600 to-violet-700 p-6 shadow-lg shadow-violet-500/20'>
  {% if title %}
  <h3 class='text-lg font-semibold text-white mb-4'>{{ title }}</h3>
  {% endif %}
  {% block card_content %}{% endblock %}
</div>
{% else %}
<div class='rounded-xl bg-[#1a1730] border border-[#2d2754] p-6 shadow-lg shadow-black/20'>
  {% if title %}
  <h3 class='text-lg font-semibold text-[#f0eef5] mb-4'>{{ title }}</h3>
  {% endif %}
  {% block card_content %}{% endblock %}
</div>
{% endif %}
