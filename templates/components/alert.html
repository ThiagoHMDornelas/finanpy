{% if type == 'success' %}
<div class='rounded-lg bg-green-500/10 border border-green-500/20 text-green-400 px-4 py-3 text-sm flex items-start gap-3'>
  <svg class='w-5 h-5 flex-shrink-0 mt-0.5' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
    <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z'/>
  </svg>
  <span class='flex-1'>{{ message }}</span>
  <button type='button' onclick="this.parentElement.remove()" class='flex-shrink-0 text-green-400/60 hover:text-green-400 transition-all duration-200'>
    <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
      <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/>
    </svg>
  </button>
</div>
{% elif type == 'error' %}
<div class='rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 text-sm flex items-start gap-3'>
  <svg class='w-5 h-5 flex-shrink-0 mt-0.5' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
    <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'/>
  </svg>
  <span class='flex-1'>{{ message }}</span>
  <button type='button' onclick="this.parentElement.remove()" class='flex-shrink-0 text-red-400/60 hover:text-red-400 transition-all duration-200'>
    <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
      <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/>
    </svg>
  </button>
</div>
{% elif type == 'warning' %}
<div class='rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 px-4 py-3 text-sm flex items-start gap-3'>
  <svg class='w-5 h-5 flex-shrink-0 mt-0.5' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
    <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.734-3L13.734 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.734 3z'/>
  </svg>
  <span class='flex-1'>{{ message }}</span>
  <button type='button' onclick="this.parentElement.remove()" class='flex-shrink-0 text-amber-400/60 hover:text-amber-400 transition-all duration-200'>
    <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
      <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/>
    </svg>
  </button>
</div>
{% elif type == 'info' %}
<div class='rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400 px-4 py-3 text-sm flex items-start gap-3'>
  <svg class='w-5 h-5 flex-shrink-0 mt-0.5' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
    <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'/>
  </svg>
  <span class='flex-1'>{{ message }}</span>
  <button type='button' onclick="this.parentElement.remove()" class='flex-shrink-0 text-blue-400/60 hover:text-blue-400 transition-all duration-200'>
    <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
      <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/>
    </svg>
  </button>
</div>
{% endif %}
