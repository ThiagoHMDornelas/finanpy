<div id='{{ modal_id }}' class='fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden' onclick="if(event.target===this)closeModal('{{ modal_id }}')">
  <div class='w-full max-w-md rounded-xl bg-[#1a1730] border border-[#2d2754] p-6 shadow-2xl'>
    <div class='flex items-center justify-between mb-4'>
      <h3 class='text-lg font-semibold text-[#f0eef5]'>{{ title }}</h3>
      <button type='button' onclick="closeModal('{{ modal_id }}')" class='text-[#6b6785] hover:text-[#f0eef5] transition-all duration-200'>
        <svg class='w-5 h-5' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
          <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/>
        </svg>
      </button>
    </div>
    {% if description %}
    <p class='mt-2 text-sm text-[#a09cb5]'>{{ description }}</p>
    {% endif %}
    <div class='mt-4'>
      {% block modal_content %}{% endblock %}
    </div>
    <div class='flex items-center justify-end gap-3 mt-6'>
      <button type='button' onclick="closeModal('{{ modal_id }}')" class='px-4 py-2 rounded-lg border border-[#2d2754] text-[#a09cb5] hover:text-[#f0eef5] hover:border-[#6b6785] transition-all duration-200 text-sm font-medium'>
        {{ cancel_text|default:"Cancelar" }}
      </button>
      {% if form_action %}
      <form method='post' action='{{ form_action }}' class='inline'>
        {% csrf_token %}
        <button type='submit' class='px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium text-sm shadow-lg shadow-violet-500/25 hover:shadow-violet-500/40 transition-all duration-200'>
          {{ confirm_text|default:"Confirmar" }}
        </button>
      </form>
      {% elif danger %}
      <button type='button' onclick="closeModal('{{ modal_id }}')" class='px-4 py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 transition-all duration-200 text-sm font-medium'>
        {{ confirm_text|default:"Excluir" }}
      </button>
      {% else %}
      <button type='button' onclick="closeModal('{{ modal_id }}')" class='px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium text-sm shadow-lg shadow-violet-500/25 hover:shadow-violet-500/40 transition-all duration-200'>
        {{ confirm_text|default:"Confirmar" }}
      </button>
      {% endif %}
    </div>
  </div>
</div>
<script>
  function openModal(id) {
    document.getElementById(id).classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
    document.body.style.overflow = '';
  }
</script>
