{% extends 'layouts/app.html' %}

{% block title %}Alterar Senha — Finanpy{% endblock %}

{% block app_content %}
<div class='max-w-xl mx-auto'>
  <div class='flex items-center justify-between mb-6'>
    <h1 class='text-2xl font-bold text-[#f0eef5]'>Alterar Senha</h1>
    <a href='{% url "profiles:detail" %}' class='text-sm text-[#a09cb5] hover:text-[#f0eef5] transition-all duration-200'>Voltar</a>
  </div>
  <div class='rounded-xl bg-[#1a1730] border border-[#2d2754] p-6 shadow-lg shadow-black/20'>
    <form method='post' class='space-y-5'>
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label for='{{ field.id_for_label }}' class='block text-sm font-medium text-[#a09cb5] mb-1.5'>{{ field.label }}</label>
        <input type='password' id='{{ field.id_for_label }}' name='{{ field.html_name }}' placeholder='{{ field.field.widget.attrs.placeholder|default:"" }}' class='w-full px-4 py-2.5 rounded-lg bg-[#0f0d1a] border border-[#2d2754] text-[#f0eef5] placeholder-[#6b6785] focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-all duration-200 {% if field.errors %}border-red-500{% endif %}'>
        {% for error in field.errors %}
        <p class='text-red-400 text-sm mt-1'>{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}
      <div class='flex items-center gap-3 pt-2'>
        <button type='submit' class='px-6 py-2.5 rounded-lg bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium text-sm shadow-lg shadow-violet-500/25 hover:shadow-violet-500/40 transition-all duration-200'>
          Alterar Senha
        </button>
        <a href='{% url "profiles:detail" %}' class='px-4 py-2.5 text-[#a09cb5] hover:text-[#f0eef5] transition-all duration-200 text-sm font-medium'>
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
